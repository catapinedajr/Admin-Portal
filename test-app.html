<!DOCTYPE html>
<html>
<head>
    <title>Test App Load</title>
</head>
<body>
    <div id="test">Testing if server serves static content</div>
    <script>
        // Test if JavaScript runs
        console.log("JavaScript is working");
        document.getElementById('test').innerHTML = "JavaScript executed successfully";
        
        // Test if we can fetch API
        fetch('/api/user')
            .then(response => response.json())
            .then(data => {
                console.log('API response:', data);
                document.getElementById('test').innerHTML += '<br>API call successful: ' + JSON.stringify(data);
            })
            .catch(error => {
                console.error('API error:', error);
                document.getElementById('test').innerHTML += '<br>API call failed: ' + error.message;
            });
    </script>
</body>
</html>
