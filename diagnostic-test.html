<!DOCTYPE html>
<html>
<head>
    <title>Navigation Diagnostic</title>
</head>
<body>
    <h1>Navigation Diagnostic Test</h1>
    <script>
        // Test if /money2 route is accessible
        fetch('/money2')
            .then(response => {
                console.log('Direct /money2 fetch status:', response.status);
                return response.text();
            })
            .then(html => {
                console.log('Response contains:', html.includes('money2') ? 'money2 reference' : 'no money2 reference');
                console.log('Response length:', html.length);
            })
            .catch(error => {
                console.error('Fetch error:', error);
            });
    </script>
</body>
</html>
