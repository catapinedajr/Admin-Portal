server {
    listen 80;
    server_name admin.hodlearn.io;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets aggressively
    location ~* \.(js|css|json|webmanifest|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Redirect root path to admin dashboard
    location = / {
        return 301 /admin/;
    }

    # Only allow /admin/**, legal pages, and PWA metadata; redirect all other SPA paths
    location / {
        if ($uri !~ ^/(admin(?:/.*)?|terms|privacy|policy|manifest\.json|index\.html)$) {
            return 301 /admin/;
        }

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
