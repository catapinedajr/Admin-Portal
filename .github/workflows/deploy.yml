name: Deploy Client to AWS

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  IMAGE_NAME: hodlearn-client
  CONTAINER_NAME: hodlearn-client

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.PROD_EC2_HOST }}" >> $GITHUB_ENV
            echo "VITE_KEYCLOAK_URL=${{ secrets.PROD_KEYCLOAK_URL }}" >> $GITHUB_ENV
          else
            echo "VITE_API_BASE_URL=${{ secrets.STAGING_API_BASE_URL }}" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.STAGING_EC2_HOST }}" >> $GITHUB_ENV
            echo "VITE_KEYCLOAK_URL=${{ secrets.STAGING_KEYCLOAK_URL }}" >> $GITHUB_ENV
          fi
          echo "VITE_KEYCLOAK_REALM=${{ secrets.KEYCLOAK_REALM }}" >> $GITHUB_ENV
          echo "VITE_KEYCLOAK_CLIENT_ID=${{ secrets.KEYCLOAK_CLIENT_ID }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} \
            --build-arg VITE_KEYCLOAK_URL=${{ env.VITE_KEYCLOAK_URL }} \
            --build-arg VITE_KEYCLOAK_REALM=${{ env.VITE_KEYCLOAK_REALM }} \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=${{ env.VITE_KEYCLOAK_CLIENT_ID }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Save Docker image
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > image.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: image.tar.gz
          target: /tmp

      - name: Copy nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/admin.hodlearn.io.conf
          target: /tmp
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker load < /tmp/image.tar.gz
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 8090:80 \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f
            rm -f /tmp/image.tar.gz
            sudo cp /tmp/admin.hodlearn.io.conf /etc/nginx/sites-enabled/admin.hodlearn.io
            sudo nginx -t && sudo systemctl reload nginx
            rm -f /tmp/admin.hodlearn.io.conf
