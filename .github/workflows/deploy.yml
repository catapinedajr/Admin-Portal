name: Deploy Client to AWS

on:
  push:
    branches: [develop, main]

env:
  IMAGE_NAME: hodlearn-client
  CONTAINER_NAME: hodlearn-client

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.PROD_EC2_HOST }}" >> $GITHUB_ENV
          else
            echo "VITE_API_BASE_URL=${{ secrets.STAGING_API_BASE_URL }}" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.STAGING_EC2_HOST }}" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Save Docker image
        run: docker save ${{ env.IMAGE_NAME }}:latest | gzip > image.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: image.tar.gz
          target: /tmp

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker load < /tmp/image.tar.gz
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 80:80 -p 443:443 \
              -v /etc/nginx/ssl/api-cf-origin-cert.crt:/etc/nginx/ssl/api-cf-origin-cert.crt:ro \
              -v /etc/nginx/ssl/api-cf-origin-key.crt:/etc/nginx/ssl/api-cf-origin-key.crt:ro \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f
            rm -f /tmp/image.tar.gz
